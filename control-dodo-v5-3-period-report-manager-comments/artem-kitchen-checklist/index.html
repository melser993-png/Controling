<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6900">
<title>Ежедневный обход кухни — Артём-1</title>
<style>
:root{--o:#ff6900;--bg:#f6f7f9;--text:#17202a;--muted:#667085;--line:#e5e7eb;--green:#15803d;--greenbg:#ecfdf3;--red:#b42318;--redbg:#fff1f0;--amber:#b54708;--amberbg:#fff7e6;--blue:#175cd3;--bluebg:#eff8ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 110px}
.hero{margin:0 -12px 16px;padding:20px 18px;background:linear-gradient(135deg,#ff6900,#ff8a33);color:#fff;box-shadow:0 8px 28px rgba(255,105,0,.18)}
.hero h1{font-size:24px;line-height:1.15;margin:0 0 7px}
.sub{font-size:14px;opacity:.94}
.clock{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.pill{background:rgba(255,255,255,.2);padding:8px 11px;border-radius:12px;font-weight:800;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 8px rgba(16,24,40,.04)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:800}
.input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;font:inherit;color:var(--text);background:#fff;outline:none}
.input:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,105,0,.12)}
.note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:6px}
.progressRow{display:flex;justify-content:space-between;align-items:center}
.progress{height:9px;background:#eceff3;border-radius:999px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:var(--o);transition:.2s}
.item{padding:0;overflow:hidden}
.itemHead{padding:15px 16px 10px;display:flex;gap:12px}
.num{flex:0 0 34px;height:34px;border-radius:10px;background:#fff0e6;color:#d94801;display:flex;align-items:center;justify-content:center;font-weight:900}
.zone{font-size:13px;font-weight:900;color:#d94801;margin-bottom:3px}
.check{font-size:15px;line-height:1.35;font-weight:700}
.statuses{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 15px}
.st{border:1px solid #d0d5dd;background:#fff;border-radius:11px;padding:11px 8px;font-size:13px;font-weight:800;cursor:pointer;color:#344054}
.st.sel.ok{background:var(--greenbg);border-color:#86efac;color:var(--green)}
.st.sel.no{background:var(--amberbg);border-color:#fdba74;color:var(--amber)}
.st.sel.bad{background:var(--redbg);border-color:#fca5a5;color:var(--red)}
.st.sel.clear{background:var(--bluebg);border-color:#93c5fd;color:var(--blue)}
.commentBox{display:none;padding:0 16px 15px}
.commentBox.show{display:block}
.req{color:var(--red)}
.message{display:none;border-radius:14px;padding:14px;margin:10px 0}
.message.show{display:block}
.message.good{background:var(--greenbg);color:#166534;border:1px solid #bbf7d0}
.message.err{background:var(--redbg);color:#991b1b;border:1px solid #fecaca}
.historyItem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.historyItem:last-child{border-bottom:0}
.hname{font-weight:800}
.hmeta{font-size:12px;color:var(--muted);margin-top:4px}
.badge{align-self:start;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
.badge.good{background:var(--greenbg);color:var(--green)}
.badge.bad{background:var(--redbg);color:var(--red)}
.badge.warn{background:var(--amberbg);color:var(--amber)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));z-index:30}
.stickyIn{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.save{flex:1;border:0;border-radius:13px;padding:14px;background:var(--o);color:#fff;font-size:16px;font-weight:900}
.save:disabled{background:#cbd5e1}
.count{font-size:12px;color:var(--muted);min-width:54px;text-align:right}
@media(max-width:520px){.statuses{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Ежедневный обход кухни</h1>
    <div class="sub">Артём-1 · контроль фокусных зон D2/D3</div>
    <div class="clock"><div class="pill" id="dateNow">—</div><div class="pill" id="timeNow">—</div></div>
  </div>
  <div id="message" class="message"></div>
  <div class="card">
    <label for="inspector">Кто проводит обход <span class="req">*</span></label>
    <input class="input" id="inspector" placeholder="ФИО управляющего / менеджера" autocomplete="name">
    <div class="note">ФИО запоминается на этом устройстве. Дата и время фиксируются сервером автоматически при сохранении.</div>
  </div>
  <div class="card">
    <div class="progressRow"><strong>Заполнение чек-листа</strong><strong id="progressText">0 / 12</strong></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
  <div id="items"></div>
  <div class="card">
    <label for="overall">Общий комментарий по обходу</label>
    <textarea id="overall" rows="3" placeholder="Необязательно"></textarea>
  </div>
  <h3>Последние обходы</h3>
  <div class="card" id="history"><div class="note">Загружаю историю…</div></div>
</div>
<div class="sticky"><div class="stickyIn"><button id="save" class="save" disabled>Сохранить обход</button><div class="count" id="stickyCount">0/12</div></div></div>
<script>
const checklist=[
{n:1,zone:"Тесто",check:"Проверить качество и температуру теста. Исключить признаки несоответствия стандарту."},
{n:2,zone:"Тесто",check:"Проверить соблюдение условий хранения и использования теста в течение смены."},
{n:3,zone:"Маркировка",check:"Все открытые продукты и ингредиенты имеют корректную маркировку."},
{n:4,zone:"Маркировка",check:"Проверить даты и время маркировки, а также отсутствие просроченной продукции."},
{n:5,zone:"Инвентарь и посуда",check:"Нет сколов, трещин, повреждений и изношенного инвентаря, контактирующего с пищей."},
{n:6,zone:"Химия",check:"Отсутствует несогласованная химия."},
{n:7,zone:"Химия",check:"Основные согласованные химические средства есть в наличии и хранятся корректно."},
{n:8,zone:"Гигиена",check:"Сотрудники соответствуют стандартам внешнего вида и личной гигиены."},
{n:9,zone:"Ингредиенты",check:"Отсутствуют неутверждённые ингредиенты, продукты и посторонние запасы."},
{n:10,zone:"Электробезопасность",check:"Провода, вилки, удлинители и кабели оборудования без повреждений изоляции."},
{n:11,zone:"Детская комната",check:"Требования безопасности соблюдены, опасные элементы отсутствуют."},
{n:12,zone:"Финальный контроль",check:"Все выявленные нарушения зафиксированы и назначены действия по их устранению."}
];
const API="https://ijjtwdbirugofjrrjsax.supabase.co/functions/v1/artem-kitchen-walk";
const params=new URLSearchParams(location.search),accessKey=params.get("key")||"";
const state=new Map(),problem=new Set(["Не выполнено","Выявлено нарушение"]);
function esc(s){const d=document.createElement("div");d.textContent=String(s??"");return d.innerHTML}
function tick(){const n=new Date();dateNow.textContent=new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Vladivostok",weekday:"short",day:"2-digit",month:"long",year:"numeric"}).format(n);timeNow.textContent=new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Vladivostok",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(n)}
tick();setInterval(tick,1000);
items.innerHTML=checklist.map(x=>'<section class="card item" data-n="'+x.n+'"><div class="itemHead"><div class="num">'+x.n+'</div><div><div class="zone">'+esc(x.zone)+'</div><div class="check">'+esc(x.check)+'</div></div></div><div class="statuses"><button type="button" class="st ok" data-status="Выполнено">✓ Выполнено</button><button type="button" class="st no" data-status="Не выполнено">○ Не выполнено</button><button type="button" class="st bad" data-status="Выявлено нарушение">! Выявлено нарушение</button><button type="button" class="st clear" data-status="Нарушение не выявлено">✓ Нарушение не выявлено</button></div><div class="commentBox"><label>Комментарий / действие <span class="req">*</span></label><textarea class="itemComment" rows="3" placeholder="Что выявлено? Что уже сделано или что необходимо сделать?"></textarea></div></section>').join("");
function updateProgress(){const c=state.size,t=checklist.length;progressText.textContent=c+" / "+t;stickyCount.textContent=c+"/"+t;bar.style.width=(c/t*100)+"%";save.disabled=c!==t||!inspector.value.trim()}
document.querySelectorAll(".st").forEach(btn=>btn.addEventListener("click",()=>{const card=btn.closest(".item"),n=Number(card.dataset.n),status=btn.dataset.status;card.querySelectorAll(".st").forEach(b=>b.classList.remove("sel"));btn.classList.add("sel");card.querySelector(".commentBox").classList.toggle("show",problem.has(status));state.set(n,status);updateProgress()}));
inspector.value=localStorage.getItem("artemWalkInspector")||"";inspector.addEventListener("input",()=>{localStorage.setItem("artemWalkInspector",inspector.value);updateProgress()});updateProgress();
function showMessage(t,type="good"){message.className="message show "+type;message.innerHTML=t;window.scrollTo({top:0,behavior:"smooth"})}
async function loadHistory(){if(!accessKey){history.innerHTML='<div class="note">Откройте рабочую ссылку с ключом доступа.</div>';return}try{const r=await fetch(API+"?api=history&key="+encodeURIComponent(accessKey),{cache:"no-store"}),j=await r.json();if(!r.ok)throw new Error(j.error||"Ошибка");if(!j.walks.length){history.innerHTML='<div class="note">Сохранённых обходов пока нет.</div>';return}history.innerHTML=j.walks.map(w=>{const dt=new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Vladivostok",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(w.created_at));const cls=w.result==="Обход выполнен"?"good":w.result==="Есть нарушения"?"bad":"warn";return '<div class="historyItem"><div><div class="hname">'+esc(w.inspector_name)+'</div><div class="hmeta">'+dt+' · нарушений: '+w.violations_count+' · не выполнено: '+w.not_completed_count+'</div></div><span class="badge '+cls+'">'+esc(w.result)+'</span></div>'}).join("")}catch(e){history.innerHTML='<div class="note">Не удалось загрузить историю.</div>'}}
loadHistory();
save.addEventListener("click",async()=>{if(!accessKey){showMessage("Рабочая ссылка открыта без ключа доступа.","err");return}const payload={inspector_name:inspector.value.trim(),overall_comment:overall.value.trim(),items:[]};for(const x of checklist){const status=state.get(x.n),card=document.querySelector('.item[data-n="'+x.n+'"]'),comment=card.querySelector(".itemComment").value.trim();if(problem.has(status)&&!comment){showMessage("Добавьте комментарий/действие к проблемному пункту №"+x.n+".","err");card.scrollIntoView({behavior:"smooth",block:"center"});return}payload.items.push({n:x.n,status,comment})}save.disabled=true;save.textContent="Сохраняю…";try{const r=await fetch(API+"?key="+encodeURIComponent(accessKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw new Error(j.error||"Не удалось сохранить");showMessage("<strong>Обход сохранён.</strong><br>"+esc(j.walk.local_time.date)+" "+esc(j.walk.local_time.time)+" · "+esc(j.walk.result)+" · выявлено нарушений: "+j.walk.violations_count+".");state.clear();document.querySelectorAll(".st").forEach(b=>b.classList.remove("sel"));document.querySelectorAll(".itemComment").forEach(t=>t.value="");document.querySelectorAll(".commentBox").forEach(b=>b.classList.remove("show"));overall.value="";updateProgress();loadHistory()}catch(e){showMessage(esc(e.message||e),"err");updateProgress()}finally{save.textContent="Сохранить обход"}});
</script>
</body>
</html>
